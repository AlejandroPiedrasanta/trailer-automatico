# Tráiler automático · CINEMA PRODUCTIONS
# Compila los instaladores de Mac (Apple Silicon e Intel) en las Mac de GitHub, como CineCaptions.
# Actions > "Instaladores Mac" > Run workflow. Los .dmg quedan en "Artifacts".
#   publico = true: la version para las actualizaciones publicas (sin musica, SFX ni fuente con licencia), la que sube
#   PROGRAMA/herramientas/publicar_version.ps1 al repositorio trailer-automatico-releases.
name: Instaladores Mac
on:
  workflow_dispatch:
    inputs:
      publico:
        description: "Version publica para actualizaciones (sin musica)"
        type: boolean
        default: false
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: AppleSilicon
            runner: macos-15
          - nombre: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: ffmpeg de respaldo (si no se puede bajar el estatico)
        run: brew install ffmpeg || true
      - name: Compilar
        env:
          TRAILER_PYTHON: python3
          TRAILER_SIN_PANTALLA: '1'
          TRAILER_SIN_MUSICA: ${{ inputs.publico && '1' || '0' }}
          TRAILER_CLAVE: ${{ !inputs.publico && secrets.TRAILER_CLAVE || '' }}
        run: bash PROGRAMA/compilar/mac/construir_mac.sh
      # la ventana nativa del instalador (1.5.7) en una simulacion, para ver el diseno sin instalar nada
      - name: Capturas de la ventana del instalador
        if: ${{ !inputs.publico }}
        continue-on-error: true
        run: |
          mkdir -p capturas
          INST="$GITHUB_WORKSPACE/trailer_automatico_mac/dmg/Instalar Trailer automatico.app/Contents/MacOS/instalar"
          "$INST" --demo & P=$!
          sleep 3; screencapture -x capturas/1_instalando.png
          sleep 4; screencapture -x capturas/2_copiando.png
          sleep 5; screencapture -x capturas/3_listo.png
          kill $P 2>/dev/null || true
          "$INST" --demo-error & P=$!
          sleep 10; screencapture -x capturas/4_error.png
          kill $P 2>/dev/null || true
          cp "$HOME"/Library/Logs/DiagnosticReports/instalar*.ips capturas/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publico }}
        with:
          name: Capturas-instalador-${{ matrix.nombre }}
          path: capturas
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: Trailer-automatico-Mac-${{ matrix.nombre }}${{ inputs.publico && '-publico' || '' }}
          path: "3 INSTALADORES/Mac/*.dmg"
          if-no-files-found: error
          retention-days: 3
