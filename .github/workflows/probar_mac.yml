# Tráiler automático · CINEMA PRODUCTIONS
# Prueba en dos Mac de GitHub (chip Apple e Intel) el instalador COMPLETO, como lo recibe la persona:
#   - el disco es de «Arrástralo a Aplicaciones» (sin instalador que pida contraseña): la app se copia a Aplicaciones como
#     la persona, se abre y en su primer arranque hace lo que antes hacía el instalador (música aparte, fuentes, servicio
#     de actualizaciones del usuario); después se reemplaza sola desde el disco, también sin contraseña;
#   - una Mac que instaló con el .pkg publicado se actualiza con el paquete oculto del disco nuevo;
#   - el instalador lo trae todo (plantillas de DaVinci, musica y SFX, fuentes, looks, ffmpeg);
#   - con el programa ya instalado, se suelta una carpeta con fotos, videos y dron: la ordena, la organiza y calcula el
#     plan de las 4 plantillas. En GitHub no hay DaVinci Resolve: el armado dentro de DaVinci no se prueba aqui.
#   vieja = "1.3.9": compila esa version vieja, la instala y comprueba que el servicio la ACTUALIZA solo a la publicada en
#   trailer-automatico-releases (sin contrasena y sin perder la musica).
# Actions > "Probar instalador Mac" > Run workflow. Capturas y registros en "Artifacts".
name: Probar instalador Mac
on:
  workflow_dispatch:
    inputs:
      vieja:
        description: "Version vieja para probar la actualizacion (vacio = solo la instalacion)"
        type: string
        default: ""
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: AppleSilicon
            runner: macos-15
          - nombre: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: ffmpeg de respaldo
        run: brew install ffmpeg || true
      - name: Version vieja (para probar la actualizacion)
        if: ${{ inputs.vieja != '' }}
        run: echo "${{ inputs.vieja }}" > PROGRAMA/config/version.txt
      - name: Compilar el .dmg
        env:
          TRAILER_PYTHON: python3
          TRAILER_SIN_PANTALLA: '1'
          TRAILER_CLAVE: ${{ secrets.TRAILER_CLAVE }}
        run: bash PROGRAMA/compilar/mac/construir_mac.sh
      - name: Instalar y comprobar
        env:
          PROBAR_ACTUALIZACION: ${{ inputs.vieja != '' && '1' || '0' }}
          VIEJA: ${{ inputs.vieja }}
          PROBAR_VIEJAS: ${{ matrix.nombre == 'Intel' && '1' || '0' }}    # la de chip Apple, limpia: arrastrar en una Mac nueva
        run: bash PROGRAMA/compilar/mac/probar_instalacion.sh
      - name: Lo que trae el instalador y soltar una carpeta (programa instalado)
        if: ${{ !cancelled() }}
        run: bash PROGRAMA/compilar/mac/probar_flujo.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prueba-instalador-mac-${{ matrix.nombre }}
          path: prueba/
          retention-days: 3
